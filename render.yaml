services:
  - type: web
    name: makelogic-v3
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: makelogic-v3-db
          property: connectionString

databases:
  - name: makelogic-v3-db
    plan: free
    databaseName: makelogic
    user: makelogic
